version: 2
updates:
  # Electron embarque Chromium : ses mises à jour de sécurité sont prioritaires.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      electron:
        patterns: ['electron', 'electron-builder', 'electron-updater', 'electron-vite']
    ignore:
      # Les types de Node doivent suivre la version de Node embarquée par Electron
      # (Node 24 pour Electron 45), pas la dernière version de Node : montée manuelle
      # à chaque changement de version majeure d'Electron.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  # Application Android (Gradle, AndroidX).
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    groups:
      android-build:
        patterns: ['com.android.*', 'org.jetbrains.kotlin*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
